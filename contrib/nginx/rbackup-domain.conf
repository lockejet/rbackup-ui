# rbackup-ui：域名入口（https://<domain> -> 127.0.0.1:30031）
#
# 用法：替换 __DOMAIN__ 与证书路径（Let's Encrypt 可用 certbot 管理，或引用
#       现有的 LE snipped）；与 rbackup-ip.conf 共存即可实现"域名 + 私网 IP:端口"双入口。
# 应用侧不需要 --web-public-url：扫码链接与 cookie 会按每个请求的
# X-Forwarded-Proto/Host 自适应。

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name __DOMAIN__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;

    location / {
        proxy_pass         http://127.0.0.1:30031;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }
}
