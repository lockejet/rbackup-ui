# rbackup-ui：私网 IP:端口 入口（HTTP 8031 -> HTTPS 44331 -> 127.0.0.1:30031）
#
# 用法：替换 __LISTEN_IP__（如 192.168.8.231 / ::1 等，可写多个 listen）、
#       __CERT__ / __KEY__ 后放入 sites-available 并软链到 sites-enabled，nginx -t 后 reload。
# 注意：反代必须覆盖 X-Forwarded-*，否则应用端的扫码链接/cookie Secure/限流 IP 会错。

server {
    listen       __LISTEN_IP__:8031;
    listen       [::1]:8031;
    server_name  _;
    return 301 https://$host:44331$request_uri;
}

server {
    listen       __LISTEN_IP__:44331 ssl;
    listen       [::1]:44331 ssl;
    http2        on;
    server_name  _;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;

    location / {
        proxy_pass         http://127.0.0.1:30031;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_buffering    off;          # SSE 必须关闭缓冲
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }
}
